name: Build Hex

on:
  push:
    branches: [main]

jobs:
  build-core:
    name: Build hex-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build hex-core (Linux amd64)
        working-directory: core
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o ../hex-core-linux-amd64 .

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-core-linux-amd64
          path: hex-core-linux-amd64

  build-panel:
    name: Build hex-panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Svelte site
        working-directory: panel/site
        run: |
          npm ci
          npm run build

      - name: Copy site dist into node static
        run: |
          rm -rf panel/node/static/dist/.gitkeep
          cp -r panel/site/dist/. panel/node/static/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build hex-panel (Linux amd64)
        working-directory: panel/node
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o ../../hex-panel-linux-amd64 .

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-panel-linux-amd64
          path: hex-panel-linux-amd64

  release:
    name: Publish GitHub Release
    needs: [build-core, build-panel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: hex-core-linux-amd64

      - name: Download panel artifact
        uses: actions/download-artifact@v4
        with:
          name: hex-panel-linux-amd64

      - name: Delete existing latest release
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hex Latest Build"
          draft: false
          prerelease: false
          files: |
            hex-core-linux-amd64
            hex-panel-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}